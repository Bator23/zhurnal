<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Журнал съёмки</title>
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Журнал">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="html2pdf.bundle.min.js" defer></script>
<style>
/* Layout: one-column phone tool for a dark film set — sticky slate header, grouped field cards, fixed action bar at the bottom. Committed dark look (used on set). */
:root {
  --bg: #12161c;
  --panel: #1a2029;
  --panel-2: #222a35;
  --line: #2f3946;
  --fg: #e8edf3;
  --muted: #8d99a8;
  --accent: #5fb0e8;      /* chroma-blue */
  --mark: #f0b640;        /* gaffer-tape amber */
  --good: #4cc38a;
  --warn: #e8a33d;
  --bad: #e86a5f;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); }
body {
  font-family: var(--font-ui); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(150px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header / slate */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; color: var(--muted); }
.sync { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.local { background: var(--warn); } .dot.err { background: var(--bad); }
.slate { margin-top: 8px; display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.slate div { padding: 6px 8px; border-right: 1px solid var(--line); min-width: 0; }
.slate div:last-child { border-right: 0; }
.slate small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.slate b { font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.slate .clip { grid-column: 1 / -1; border-top: 1px solid var(--line); border-right: 0; display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--mark); }
.tabs { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
.tab { flex: 1 0 auto; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 14px; }
.tab[aria-selected="true"] { background: var(--panel-2); color: var(--fg); border-color: var(--accent); }

/* field groups */
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; display: grid; gap: 12px; }
.group h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 600; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.f { display: grid; gap: 6px; min-width: 0; }
.f > label, .f > .lbl { font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], select, textarea {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 10px; min-height: 44px; font-size: 16px;
}
textarea { min-height: 72px; resize: vertical; }
.num { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; }
.num input { text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.step { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; font-size: 20px; min-height: 44px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 7px 12px; min-height: 36px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: #0b1620; border-color: var(--accent); font-weight: 600; }
.chip.r-good[aria-pressed="true"] { background: var(--good); border-color: var(--good); }
.chip.r-spare[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); }
.chip.r-bad[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); }
.check { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 10px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.marks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.markbtn { border: 1px solid var(--mark); color: var(--mark); background: transparent; border-radius: 7px; min-height: 44px; font-weight: 600; }
.markval { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.inline { display: flex; gap: 8px; align-items: stretch; }
.inline > :first-child { flex: 1; min-width: 0; }
.mini { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 0 12px; min-height: 44px; }
.mini.on { border-color: var(--bad); color: var(--bad); }
.photos { display: flex; flex-wrap: wrap; gap: 8px; }
.photos img { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.hint { font-size: 12px; color: var(--muted); }

/* bottom action bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-top: 1px solid var(--line); backdrop-filter: blur(6px);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .wrap { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.big { min-height: 54px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; font-size: 15px; }
.big.primary { background: var(--accent); color: #0b1620; border-color: var(--accent); font-size: 17px; }
.bar .sub { grid-column: 1 / -1; display: flex; gap: 8px; }
.bar .sub button { flex: 1; min-height: 36px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; }

/* journal */
.scene-h { margin: 18px 0 6px; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.entry { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-top: 6px; }
.entry.current { border-color: var(--accent); }
.entry .k { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.entry .d { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.pill { font-size: 11px; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); }
.pill.good { color: var(--good); border-color: var(--good); } .pill.spare { color: var(--warn); border-color: var(--warn); } .pill.bad { color: var(--bad); border-color: var(--bad); }
.acts { display: flex; gap: 6px; }
.acts button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; min-height: 38px; padding: 0 10px; font-size: 13px; }
.acts .del.arm { border-color: var(--bad); color: var(--bad); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }


.slate { cursor: pointer; }
.board { position: fixed; inset: 0; z-index: 50; background: #fff; color: #000; display: grid; grid-template-rows: auto 1fr auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); font-family: var(--font-mono); }
.board .bh { display: flex; justify-content: space-between; gap: 12px; font-size: clamp(14px, 4vw, 28px); font-weight: 600; border-bottom: 4px solid #000; padding-bottom: 8px; }
.board .bg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; align-content: center; }
.board .bc { border: 3px solid #000; margin: -1.5px; padding: 8px 12px; min-width: 0; }
.board .bc small { display: block; font-family: var(--font-ui); font-size: clamp(12px, 3.5vw, 22px); text-transform: uppercase; letter-spacing: .08em; }
.board .bc b { display: block; font-size: clamp(56px, 22vw, 200px); line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.board .bc.scene b { font-size: clamp(40px, 14vw, 140px); }
.board .bf { display: flex; justify-content: space-between; gap: 12px; font-size: clamp(14px, 4.5vw, 30px); border-top: 4px solid #000; padding-top: 8px; }
.board .bx { font-family: var(--font-ui); font-size: 13px; color: #555; text-align: center; margin-top: 6px; }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; z-index: 20; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast button { border: 0; background: none; color: var(--accent); font-weight: 600; }
.big-btn { width: 100%; min-height: 50px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; margin-top: 8px; }
.big-btn.primary { background: var(--accent); color: #0b1620; border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .chip, .tab, .big { transition: background .12s, border-color .12s; } }
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand">
    <h1 id="projName">Журнал съёмки</h1>
    <span class="sync"><span class="dot ok" id="syncDot"></span><span id="syncText">сохраняется на телефоне</span></span>
  </div>
  <div class="slate" id="slate"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-rec" aria-selected="true" data-view="rec">Запись</button>
    <button class="tab" role="tab" id="t-log" aria-selected="false" data-view="log">Журнал</button>
    <button class="tab" role="tab" id="t-set" aria-selected="false" data-view="set">Справочники</button>
    <button class="tab" role="tab" id="t-exp" aria-selected="false" data-view="exp">Экспорт</button>
  </div>
</div></div>

<main class="wrap">
  <section id="v-rec"></section>
  <section id="v-log" hidden></section>
  <section id="v-set" hidden></section>
  <section id="v-exp" hidden></section>
</main>

<div class="bar" id="bar"><div class="wrap">
  <button class="big primary" id="b-take">＋ Дубль</button>
  <button class="big" id="b-shot">＋ Кадр</button>
  <button class="big" id="b-setup">＋ Сетап</button>
  <div class="sub"><button id="b-board">Хлопушка</button><button id="b-scene">Новая сцена</button><button id="b-dup">Пара 24 / 48 fps</button></div>
</div></div>

<div id="pdfHost" style="position:fixed;left:-20000px;top:0;width:1120px;background:#fff;color:#111"></div>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nowTime = () => new Date().toLocaleTimeString("ru-RU", { hour12: false });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const LS_KEY = "onset-log-standalone-v1";

/* ---------- defaults ---------- */
const DEFAULT_SETTINGS = {
  project: "Проект", unit: "Юнит", date: "", director: "", dp: "", supervisor: "", simple: true,
  cameras: ["ARRI Alexa (уточнить модель)", "ARRI Alexa 35", "ARRI Alexa Mini LF", "ARRI Alexa Mini"],
  lenses: ["Prime 18 мм", "Prime 25 мм", "Prime 32 мм", "Prime 40 мм", "Prime 50 мм", "Prime 75 мм", "Prime 100 мм", "Prime 135 мм"],
  scenes: ["1 · Сцена 1", "2 · Сцена 2", "3 · Сцена 3", "4 · Сцена 4", "5 · Сцена 5", "6 · Сцена 6", "7 · Сцена 7", "8 · Сцена 8"],
  fps: ["24", "25", "48", "50", "100", "120", "200", "250"],
  shutter: ["180°", "360°", "172.8°", "90°", "1/50", "1/100"],
  iso: ["400", "640", "800", "1280", "1600", "3200"],
  wb: ["3200K", "4300K", "5600K", "6500K"],
  tstop: ["1.4", "2", "2.8", "4", "5.6", "8", "11"],
  codec: ["ARRIRAW", "ProRes 4444 XQ", "ProRes 4444", "ProRes 422 HQ"],
  filters: ["нет", "ND .3", "ND .6", "ND .9", "ND 1.2", "Pro-Mist 1/8", "Pro-Mist 1/4", "Поляризатор"],
  moves: ["статика", "долли", "слайдер", "ручная", "стедикам", "кран / евромаунт", "панорама", "вертиго-зум"],
  markers: ["крестики (тейп)", "линии / полосы", "мячики", "боксы", "систенд", "пенокартон"],
  aiTasks: ["замена фона", "достройка окружения", "замена предмета", "погода", "время суток", "костюм", "волосы / борода", "массовка", "транспорт", "полёт / трюк", "рапид", "свет"],
  weather: ["солнце", "облачно", "дождь", "павильон"]
};
const LISTS = ["cameras", "lenses", "scenes", "fps", "shutter", "iso", "wb", "tstop", "codec", "filters", "moves", "markers", "aiTasks", "weather"];
const LIST_LABELS = { cameras: "Камеры", lenses: "Объективы (фокусное берётся из числа в строке)", scenes: "Сцены", fps: "Частоты кадров", shutter: "Выдержка / угол", iso: "ISO / EI", wb: "Баланс белого", tstop: "Диафрагма (T)", codec: "Кодек / формат", filters: "Фильтры", moves: "Движение камеры", markers: "Метки и опоры", aiTasks: "Что меняет ИИ", weather: "Погода / условия" };

/* ---------- field schema ---------- */
const GROUPS = [
  { title: "Кадр и клип", fields: [
    { k: "scene", l: "Сцена", t: "select", src: "scenes", wide: true },
    { k: "shot", l: "Кадр", t: "num" }, { k: "setup", l: "Сетап (вариант)", t: "num" }, { k: "take", l: "Дубль", t: "num" },
    { k: "cam", l: "Камера A / B", t: "chips", opts: ["A", "B"] },
    { adv: 1, k: "roll", l: "Ролл (карта)", t: "text", ph: "A001" }, { adv: 1, k: "clip", l: "Клип", t: "text", ph: "C001" },
    { k: "marks", l: "Время дубля (часы телефона)", t: "marks", wide: true },
    { adv: 1, k: "tcIn", l: "TC начала (с камеры)", t: "text", ph: "10:42:07:12" }, { adv: 1, k: "tcOut", l: "TC конца", t: "text", ph: "10:42:21:03" }
  ]},
  { title: "Камера", fields: [
    { k: "camera", l: "Модель", t: "select", src: "cameras", wide: true },
    { adv: 1, k: "codec", l: "Кодек / формат", t: "chips", src: "codec", wide: true },
    { adv: 1, k: "sensor", l: "Режим матрицы / разрешение", t: "text", ph: "4.6K 16:9" },
    { k: "fps", l: "fps", t: "chips", src: "fps", wide: true },
    { k: "shutter", l: "Выдержка / угол", t: "chips", src: "shutter", wide: true },
    { k: "iso", l: "ISO / EI", t: "chips", src: "iso", wide: true },
    { k: "wb", l: "Баланс белого", t: "chips", src: "wb", wide: true },
    { adv: 1, k: "filters", l: "Фильтры", t: "multi", src: "filters", wide: true }
  ]},
  { title: "Объектив", fields: [
    { k: "lens", l: "Объектив", t: "select", src: "lenses", wide: true },
    { k: "focal", l: "Фокусное, мм", t: "num" }, { adv: 1, k: "focalEnd", l: "Фокусное в конце (вертиго), мм", t: "num" },
    { adv: 1, k: "tstop", l: "Диафрагма T", t: "chips", src: "tstop", wide: true },
    { k: "focusDist", l: "Дистанция фокуса, м", t: "num", step: 0.1 }
  ]},
  { title: "Геометрия", fields: [
    { k: "camHeight", l: "Высота камеры, см", t: "num", step: 5 }, { adv: 1, k: "tilt", l: "Наклон, °", t: "num" },
    { k: "distActor", l: "До актёра, м", t: "num", step: 0.1 }, { k: "distBg", l: "До фона / реквизита, м", t: "num", step: 0.1 }
  ]},
  { title: "Движение", fields: [
    { k: "move", l: "Тип", t: "chips", src: "moves", wide: true },
    { adv: 1, k: "speed", l: "Скорость", t: "chips", opts: ["медленно", "средне", "быстро"], wide: true },
    { adv: 1, k: "moveLen", l: "Длина хода, м", t: "num", step: 0.5 }, { k: "moveNote", l: "Направление / описание", t: "text", ph: "наезд, слева направо…" }
  ]},
  { title: "Сцена и ИИ", fields: [
    { k: "aiTask", l: "Что меняет ИИ", t: "multi", src: "aiTasks", wide: true },
    { k: "markers", l: "Метки и опоры в кадре", t: "multi", src: "markers", wide: true },
    { adv: 1, k: "markersNote", l: "Метки — уточнение", t: "text", ph: "крестики через 1 м на задней стене" },
    { k: "characters", l: "Персонажи в кадре", t: "text", ph: "парень, девушка" },
    { adv: 1, k: "lightK", l: "Свет: температура ключа, K", t: "num", step: 100 },
    { adv: 1, k: "weather", l: "Условия", t: "chips", src: "weather", wide: true },
    { k: "lightChange", l: "Динамический свет (тени веток, движение света)", t: "check" },
    { adv: 1, k: "pairWith", l: "Пара для сравнения (24/48 fps)", t: "text", ph: "1-2-3 дубль 1" }
  ]},
  { title: "Контроль", fields: [
    { k: "plate", l: "Чистый плейт снят", t: "check" }, { adv: 1, k: "grey", l: "Серая карта / ColorChecker", t: "check" },
    { adv: 1, k: "grid", l: "Сетка дисторсии снята", t: "check" }, { k: "setupPhoto", l: "Фото сетапа сделано", t: "check" },
    { k: "rating", l: "Оценка дубля", t: "rating", wide: true },
    { k: "note", l: "Заметка", t: "note", wide: true }
  ]}
];
const ALL_FIELDS = GROUPS.flatMap(g => g.fields);

/* ---------- state ---------- */
let S = { settings: structuredClone(DEFAULT_SETTINGS), takes: [], current: null, settingsUpdated: 0 };
function freshTake() {
  const st = S.settings;
  return { id: uid(), created: Date.now(), updated: Date.now(), deleted: false,
    scene: st.scenes[0] || "1", setup: 1, shot: 1, take: 1, cam: "A", roll: "A001", clip: "C001",
    tStart: "", tEnd: "", tcIn: "", tcOut: "", camera: st.cameras[0] || "", codec: "", sensor: "", fps: "25", shutter: "180°", iso: "800", wb: "5600K", filters: [],
    lens: "", focal: "", focalEnd: "", tstop: "", focusDist: "", camHeight: "", tilt: "", distActor: "", distBg: "",
    move: "статика", speed: "", moveLen: "", moveNote: "", aiTask: [], markers: [], markersNote: "", characters: "", lightK: "", weather: "", lightChange: false, pairWith: "",
    plate: false, grey: false, grid: false, setupPhoto: false, rating: "", note: "", photos: [] };
}
const simple = () => S.settings.simple !== false;
const live = () => S.takes.filter(t => !t.deleted);
const cur = () => S.takes.find(t => t.id === S.current && !t.deleted);

function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.settings && Array.isArray(d.takes)) S = { ...S, ...d, settings: { ...structuredClone(DEFAULT_SETTINGS), ...d.settings } }; } } catch (e) {}
  if (!live().length) { const t = freshTake(); S.takes.push(t); S.current = t.id; }
  if (!cur()) S.current = live()[live().length - 1].id;
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- cloud sync (db, private per person) ---------- */
let DB = null, MYID = null; const pending = new Map(); const inflight = new Set(); let settingsTimer = null;
function setSync(state, text) { $("#syncDot").className = "dot " + state; $("#syncText").textContent = text; }
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") { setSync("local", "только на телефоне"); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { setSync("local", "только на телефоне"); return; }
    MYID = await user.id(); if (!MYID) { setSync("local", "только на телефоне"); return; }
    DB = db; setSync("local", "загружаю…");
    const base = "data/users/" + MYID;
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000));
    const [setSnap, takesSnap] = await Promise.race([Promise.all([DB.doc(base + "/app/settings").get(), DB.collection(base + "/takes").get()]), timeout]);
    const remoteSet = setSnap.exists ? setSnap.data() : null;
    if (remoteSet && (remoteSet.updated || 0) > (S.settingsUpdated || 0)) { S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...remoteSet.settings }; S.settingsUpdated = remoteSet.updated; }
    else if (S.settingsUpdated) queueSettings();
    const byId = new Map(S.takes.map(t => [t.id, t]));
    takesSnap.docs.forEach(d => { const r = d.data(); if (!r || !r.id) return; const l = byId.get(r.id); if (!l || (r.updated || 0) > (l.updated || 0)) byId.set(r.id, r); });
    const remote = new Map(takesSnap.docs.map(d => [d.id, d.data() || {}]));
    S.takes = [...byId.values()].sort((a, b) => a.created - b.created);
    S.takes.forEach(t => { const r = remote.get(t.id); if (!r || (t.updated || 0) > (r.updated || 0)) queueTake(t.id, true); });
    if (!cur()) { const l = live(); if (l.length) S.current = l[l.length - 1].id; else { const t = freshTake(); S.takes.push(t); S.current = t.id; } }
    saveLocal(); renderAll(); setSync("ok", "сохранено в облаке");
  } catch (e) { DB = null; setSync("err", "облако недоступно, пишу на телефон"); }
}
function queueTake(id, quiet) {
  if (!DB) return;
  clearTimeout(pending.get(id)); pending.set(id, setTimeout(() => flushTake(id), quiet ? 50 : 700));
  setSync("local", "сохраняю…");
}
async function flushTake(id) {
  pending.delete(id);
  if (inflight.has(id)) { queueTake(id); return; }
  const t = S.takes.find(x => x.id === id); if (!t || !DB) return;
  inflight.add(id);
  try { await DB.doc("data/users/" + MYID + "/takes/" + id).set(JSON.parse(JSON.stringify(t))); if (!pending.size) setSync("ok", "сохранено в облаке"); }
  catch (e) { setSync("err", "не сохранилось в облако, есть на телефоне"); }
  finally { inflight.delete(id); }
}
function queueSettings() {
  if (!DB) return; clearTimeout(settingsTimer);
  settingsTimer = setTimeout(async () => { try { await DB.doc("data/users/" + MYID + "/app/settings").set({ settings: S.settings, updated: S.settingsUpdated }); } catch (e) { setSync("err", "справочники не сохранились в облако"); } }, 700);
}
function touch(t) { t.updated = Date.now(); saveLocal(); queueTake(t.id); }

/* ---------- helpers ---------- */
const lensMm = s => { const m = String(s || "").match(/(\d+(?:[.,]\d+)?)\s*мм/i) || String(s || "").match(/(\d+(?:[.,]\d+)?)(?!.*\d)/); return m ? m[1].replace(",", ".") : ""; };
const incCode = s => String(s || "").replace(/(\d+)(?!.*\d)/, d => String(+d + 1).padStart(d.length, "0"));
const fmtVal = v => Array.isArray(v) ? v.join(", ") : (v === true ? "да" : v === false ? "" : (v ?? ""));
const sceneShort = s => String(s || "").split("·")[0].trim() || s;

function opts(f) { return f.opts || S.settings[f.src] || []; }
function fieldHTML(f, t) {

  switch (f.t) {
    case "text": return `<div class="f"><label for="${id}">${f.l}</label><input type="text" id="${id}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph || "")}" autocomplete="off"></div>`;
    case "num": return `<div class="f"><label for="${id}">${f.l}</label><div class="num"><button class="step" data-step="-${f.step || 1}" data-k="${f.k}" aria-label="минус">−</button><input type="number" inputmode="decimal" id="${id}" data-k="${f.k}" value="${esc(v)}" step="${f.step || 1}"><button class="step" data-step="${f.step || 1}" data-k="${f.k}" aria-label="плюс">+</button></div></div>`;
    case "select": { const o = opts(f); const has = o.includes(v);
      return `<div class="f"><label for="${id}">${f.l}</label><select id="${id}" data-k="${f.k}"><option value="">—</option>${o.map(x => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("")}${v && !has ? `<option selected>${esc(v)}</option>` : ""}</select></div>`; }
    case "chips": return `<div class="f"><span class="lbl" id="${id}">${f.l}</span><div class="chips" role="group" aria-labelledby="${id}">${opts(f).map(x => `<button class="chip" data-k="${f.k}" data-v="${esc(x)}" aria-pressed="${x === v}">${esc(x)}</button>`).join("")}</div></div>`;
    case "multi": return `<div class="f"><span class="lbl" id="${id}">${f.l}</span><div class="chips" role="group" aria-labelledby="${id}">${opts(f).map(x => `<button class="chip" data-k="${f.k}" data-m="${esc(x)}" aria-pressed="${(v || []).includes(x)}">${esc(x)}</button>`).join("")}</div></div>`;
    case "check": return `<label class="check" for="${id}"><input type="checkbox" id="${id}" data-k="${f.k}" ${v ? "checked" : ""}>${f.l}</label>`;

function renderRec() {

/* ---------- toast ---------- */
let toastT = null;
function toast(msg, action, fn) {
  document.querySelector(".toast")?.remove(); clearTimeout(toastT);
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status");
  d.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ""}`;
  if (action) d.querySelector("button").onclick = () => { fn(); d.remove(); };
  document.body.appendChild(d); toastT = setTimeout(() => d.remove(), action ? 6000 : 2500);
}

/* ---------- record interactions ---------- */
function setField(k, val) {
  const t = cur(); if (!t) return;
  t[k] = val;
  if (k === "lens") { const mm = lensMm(val); if (mm) t.focal = mm; renderRec(); }
  touch(t); renderSlate();
}
$("#v-rec").addEventListener("input", e => {
  const el = e.target; const k = el.dataset.k; if (!k) return;
  if (el.type === "checkbox") setField(k, el.checked); else if (el.tagName !== "SELECT") setField(k, el.value);
});
$("#v-rec").addEventListener("change", e => { const el = e.target; if (el.tagName === "SELECT" && el.dataset.k) setField(el.dataset.k, el.value); });
$("#v-rec").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const t = cur(); if (!t) return;
  if (b.dataset.step) { const k = b.dataset.k, st = parseFloat(b.dataset.step); const n = (parseFloat(String(t[k]).replace(",", ".")) || 0) + st; const val = Math.round(n * 100) / 100; setField(k, k === "tilt" ? (val === 0 ? "" : String(val)) : (val <= 0 ? "" : String(val))); const inp = $("#f-" + k); if (inp) inp.value = t[k]; return; }
  if (b.dataset.v !== undefined && b.dataset.k) { const k = b.dataset.k; const val = t[k] === b.dataset.v ? "" : b.dataset.v; setField(k, val); b.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.v === val))); return; }
  if (b.dataset.m !== undefined) { const k = b.dataset.k; const arr = new Set(t[k] || []); arr.has(b.dataset.m) ? arr.delete(b.dataset.m) : arr.add(b.dataset.m); setField(k, [...arr]); b.setAttribute("aria-pressed", String(arr.has(b.dataset.m))); return; }
  if (b.dataset.mark) { setField(b.dataset.mark, nowTime()); renderRec(); toast(b.dataset.mark === "tStart" ? "Мотор: " + t.tStart : "Стоп: " + t.tEnd); return; }
});

const CLEAR_TAKE = ["tStart", "tEnd", "tcIn", "tcOut", "rating", "note"];
const CLEAR_SETUP = ["camHeight", "tilt", "distActor", "distBg", "move", "speed", "moveLen", "moveNote", "markersNote", "plate", "grey", "grid", "setupPhoto", "focalEnd", "lightChange", "pairWith"];
function spawn(kind) {
  const t = cur(); if (!t) return;
  const n = { ...structuredClone(t), id: uid(), created: Date.now(), updated: Date.now(), deleted: false, photos: [] };
  CLEAR_TAKE.forEach(k => n[k] = typeof t[k] === "boolean" ? false : "");
  n.clip = incCode(t.clip) || t.clip;
  const num = v => parseInt(v, 10) || 0;
  if (kind === "take") n.take = num(t.take) + 1;
  if (kind === "shot") { n.shot = num(t.shot) + 1; n.setup = 1; n.take = 1; CLEAR_SETUP.forEach(k => n[k] = typeof t[k] === "boolean" ? false : ""); n.move = "статика"; n.markers = []; }
  if (kind === "setup") { n.setup = num(t.setup) + 1; n.take = 1; }
  if (kind === "scene") { const sc = S.settings.scenes; const i = sc.indexOf(t.scene); n.scene = sc[i + 1] || t.scene; n.setup = 1; n.shot = 1; n.take = 1; CLEAR_SETUP.forEach(k => n[k] = typeof t[k] === "boolean" ? false : ""); n.move = "статика"; n.markers = []; n.aiTask = []; n.characters = ""; }
  if (kind === "dup50") { n.take = num(t.take) + 1; n.fps = t.fps === "48" ? "24" : "48"; n.pairWith = `кадр ${t.shot} · сет ${t.setup} · дубль ${t.take} (${t.fps} fps)`; }
  S.takes.push(n); S.current = n.id; touch(n); renderSlate(); renderRec(); window.scrollTo(0, 0);
  const names = { take: "Новый дубль", shot: "Новый кадр", setup: "Новый сетап", scene: "Новая сцена", dup50: "Пара в " + n.fps + " fps" };
  toast(`${names[kind]}: кадр ${n.shot} · сет ${n.setup} · дубль ${n.take}`, "Отменить", () => { n.deleted = true; touch(n); S.current = t.id; saveLocal(); renderAll(); });
}
$("#b-take").onclick = () => spawn("take"); $("#b-shot").onclick = () => spawn("shot"); $("#b-setup").onclick = () => spawn("setup");
$("#b-board").onclick = () => openBoard(); $("#b-scene").onclick = () => spawn("scene"); $("#b-dup").onclick = () => spawn("dup50");

/* ---------- dictation & photos ---------- */
let dict = null, dictOn = false;
async function setupMic() {
  const btn = $("#micBtn"); if (!btn) return;
  if (!dict) { try { dict = window.claude?.use ? await window.claude.use("dictation") : null; } catch (e) { dict = null; }
    if (dict) { dict.onFinal(({ text }) => { const t = cur(); if (!t || !text) return; t.note = (t.note ? t.note.trimEnd() + " " : "") + text.trim(); touch(t); const ta = $("#f-note"); if (ta) ta.value = t.note; });
      dict.onState(({ state }) => { dictOn = state === "listening" || state === "starting"; const b = $("#micBtn"); if (b) b.classList.toggle("on", dictOn); }); } }
  const b2 = $("#micBtn"); if (!b2 || !dict) return; b2.hidden = false;
  b2.onclick = () => { if (dictOn) { dict.stop().catch(() => {}); return; } dict.start().catch(err => { if (err?.code === "not_granted") { b2.hidden = true; } }); };
}
let assets = null, assetsTried = false;
async function setupPhotos() {
  if (!assetsTried) { assetsTried = true; try { assets = window.claude?.use ? await window.claude.use("assets") : null; } catch (e) { assets = null; } }
  const lbl = $("#photoLbl"), hint = $("#photoHint"), inp = $("#photoIn"); if (!lbl) return;
  if (!assets) return; lbl.hidden = false; hint.hidden = true;
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return; const t = cur(); toast("Загружаю фото…");
    try { const r = await assets.upload(f); t.photos = [...(t.photos || []), { id: r.id, url: r.url }]; touch(t); renderRec(); toast("Фото добавлено"); }
    catch (e) { toast("Фото не загрузилось. Сделай фото на телефон и отметь галочку."); }
    inp.value = "";
  };

/* ---------- export ---------- */
async function saveFile(filename, data) {
  const type = filename.endsWith(".pdf") ? "application/pdf" : filename.endsWith(".csv") ? "text/csv" : "application/json";
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  try {
    const file = new File([blob], filename, { type });
    const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); toast("Готово"); return; }
  } catch (e) { if (e && e.name === "AbortError") { toast("Отменено"); return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast("Файл сохранён");
}
const fileBase = () => `${S.settings.project}_${S.settings.unit}_${S.settings.date}`.replace(/[^\p{L}\p{N}._-]+/gu, "_");
function sortedTakes() { const sc = S.settings.scenes; return live().slice().sort((a, b) => ((sc.indexOf(a.scene) + 1 || 999) - (sc.indexOf(b.scene) + 1 || 999)) || a.created - b.created); }

function csv() {
  const cols = [["scene", "Сцена"], ["setup", "Сетап"], ["shot", "Кадр"], ["take", "Дубль"], ["cam", "Камера"], ["roll", "Ролл"], ["clip", "Клип"], ["tStart", "Мотор (время)"], ["tEnd", "Стоп (время)"], ["tcIn", "TC начала"], ["tcOut", "TC конца"],
    ...ALL_FIELDS.filter(f => !["scene", "setup", "shot", "take", "cam", "roll", "clip", "marks", "tcIn", "tcOut", "photos"].includes(f.k)).map(f => [f.k, f.l])];
  const cell = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [cols.map(c => cell(c[1])).join(";")];
  sortedTakes().forEach(t => lines.push(cols.map(([k]) => cell(k === "photos" ? (t.photos || []).map(p => { try { return new URL(p.url, location.href).href; } catch (e) { return p.url; } }).join(" ") : fmtVal(t[k]))).join(";")));
  return "﻿" + lines.join("\r\n");
}
function pdfHTML() {
  const st = S.settings, rows = sortedTakes();
  const by = new Map(); rows.forEach(t => { if (!by.has(t.scene)) by.set(t.scene, []); by.get(t.scene).push(t); });
  const td = s => `<td>${esc(s)}</td>`;
  const head = ["Кадр/Сет/Дубль", "Клип · время · TC", "Камера · кодек", "Объектив", "fps · выдержка · ISO · WB", "Высота · наклон · дистанции", "Движение", "Метки / опоры", "Что меняет ИИ", "Свет · условия", "Контроль", "Оценка · заметка"];
  const css = `*{box-sizing:border-box}body,div{font-family:Arial,Helvetica,sans-serif;color:#111}h1{font-size:20px;margin:0 0 4px}p.m{margin:0 0 10px;font-size:11px;color:#444}h2{font-size:14px;margin:14px 0 6px;color:#1d4f7a}table{width:100%;border-collapse:collapse;font-size:9.5px;table-layout:fixed}th,td{border:1px solid #bbb;padding:3px 4px;vertical-align:top;overflow-wrap:anywhere}th{background:#e6eef6;text-align:left}tr{page-break-inside:avoid}`;
  return `<style>${css}</style><h1>${esc(st.project)} · ${esc(st.unit)} · ${esc(st.date)}</h1><p class="m">Режиссёр: ${esc(st.director)} · Оператор: ${esc(st.dp)} · AI-супервайзер: ${esc(st.supervisor)} · Дублей: ${rows.length} · Сформировано: ${new Date().toLocaleString("ru-RU")}</p>` +
    [...by.entries()].map(([sc, arr]) => `<h2>Сцена ${esc(sc)}</h2><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${arr.map(t => `<tr>${[
      `${t.shot} / ${t.setup} / ${t.take}`,
      [simple() ? "кам " + t.cam : t.cam + " " + t.roll + t.clip, t.tStart && ("⏱ " + t.tStart + (t.tEnd ? "–" + t.tEnd : "")), t.tcIn && ("TC " + t.tcIn + (t.tcOut ? "–" + t.tcOut : ""))].filter(Boolean).join("\n"),
      [t.camera, t.codec, t.sensor].filter(Boolean).join(" · "),
      [t.lens, t.focal && (t.focal + " мм" + (t.focalEnd ? "→" + t.focalEnd + " мм" : "")), t.tstop && ("T" + t.tstop), t.focusDist && ("фокус " + t.focusDist + " м"), (t.filters || []).filter(x => x !== "нет").join(", ")].filter(Boolean).join(" · "),
      [t.fps && (t.fps + " fps"), t.shutter, t.iso && ("ISO " + t.iso), t.wb].filter(Boolean).join(" · "),
      [t.camHeight && ("h " + t.camHeight + " см"), t.tilt && ("наклон " + t.tilt + "°"), t.distActor && ("актёр " + t.distActor + " м"), t.distBg && ("фон " + t.distBg + " м")].filter(Boolean).join(" · "),
      [t.move, t.speed, t.moveLen && (t.moveLen + " м"), t.moveNote].filter(Boolean).join(" · "),
      [(t.markers || []).join(", "), t.markersNote].filter(Boolean).join(" · "),
      [(t.aiTask || []).join(", "), t.pairWith && ("пара: " + t.pairWith), t.characters && ("в кадре: " + t.characters)].filter(Boolean).join(" · "),
      [t.lightK && (t.lightK + "K"), t.weather, t.lightChange && "динамический свет"].filter(Boolean).join(" · "),
      [t.plate && "плейт", t.grey && "серая карта", t.grid && "сетка", t.setupPhoto && "фото", (t.photos || []).length ? ("фото: " + t.photos.length) : ""].filter(Boolean).join(", "),
      [t.rating, t.note].filter(Boolean).join(" — ")
    ].map(td).join("")}</tr>`).join("")}</tbody></table>`).join("");
}
$("#v-exp").addEventListener("click", async e => {
  const id = e.target.id;
  if (id === "expCsv") return saveFile(fileBase() + ".csv", csv());
  if (id === "expJson") return saveFile(fileBase() + "_backup.json", JSON.stringify({ app: "onset-log", version: 1, savedAt: new Date().toISOString(), settings: S.settings, settingsUpdated: S.settingsUpdated, takes: S.takes }, null, 1));
  if (id === "expPdf") {
    if (typeof window.html2pdf !== "function") { toast("PDF сейчас недоступен — скачай CSV"); return; }
    const host = $("#pdfHost"); host.innerHTML = `<div id="pdfDoc" style="width:1040px;background:#fff;color:#111;padding:4px">${pdfHTML()}</div>`; toast("Готовлю PDF…");
    try {
      const blob = await window.html2pdf().set({ margin: 7, image: { type: "jpeg", quality: 0.92 }, html2canvas: { scale: 2, backgroundColor: "#ffffff", useCORS: true }, jsPDF: { unit: "mm", format: "a4", orientation: "landscape" }, pagebreak: { mode: ["css", "legacy"], avoid: "tr" } }).from(host.firstElementChild).outputPdf("blob");
      host.innerHTML = ""; await saveFile(fileBase() + ".pdf", blob);
    } catch (err) { host.innerHTML = ""; toast("PDF не собрался — скачай CSV"); }
  }
});
$("#v-exp").addEventListener("change", e => {
  if (e.target.id !== "impJson") return; const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result); if (!d || !Array.isArray(d.takes)) throw 0;
      const byId = new Map(S.takes.map(t => [t.id, t]));
      d.takes.forEach(r => { const l = byId.get(r.id); if (!l || (r.updated || 0) > (l.updated || 0)) byId.set(r.id, r); });
      S.takes = [...byId.values()].sort((a, b) => a.created - b.created);
      if (d.settings && (d.settingsUpdated || 0) > (S.settingsUpdated || 0)) { S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...d.settings }; S.settingsUpdated = d.settingsUpdated; queueSettings(); }
      S.takes.forEach(t => queueTake(t.id, true)); if (!cur()) S.current = live()[live().length - 1]?.id;
      saveLocal(); renderAll(); toast("Копия восстановлена: " + d.takes.length + " дубл.");
    } catch (err) { toast("Это не файл копии журнала"); }
    e.target.value = "";
  };
  rd.readAsText(f);
});
